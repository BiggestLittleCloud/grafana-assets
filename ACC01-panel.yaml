cellIdPreamble: ''
cells:
  normal-1:
    dataRef: RX Ethernet1
    bespoke:
      dataRefs:
      - RX Ethernet1
      - TX Ethernet1
      - STATE Ethernet1
      - MODE 1
      formulas:
      - 'u = data[''STATE Ethernet1''] == null ? -2 : (data[''STATE Ethernet1''] !=
        1 ? -1 : (data[''RX Ethernet1''] == null or data[''TX Ethernet1''] == null
        ? -2 : max(data[''RX Ethernet1''], data[''TX Ethernet1''])))'
      drives:
      - elementName: g
        elementPosition: 1
        attribsSet:
          visibility: 'data[''MODE 1''] == 1 ? ''hidden'' : ''visible'''
    label:
      bespokeDataRef: u
      separator: replace
      units: percent
      decimalPoints: 0
      valueMappings:
      - value: -2
        text: "\u2014"
      - value: -1
        text: DOWN
    fillColor:
      bespokeDataRef: u
      thresholds: &id001
      - color: '#475569'
        level: -2
      - color: '#22c55e'
        level: 0
      - color: '#eab308'
        level: 50
      - color: '#ef4444'
        level: 80
    fillColorElementFilter:
    - name: rect
